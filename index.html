<style>
body{margin:0}
[hidden]{display:none!important}
/* Layout: app mobile — barre du haut collante, contenu en cartes, barre d'onglets en bas */
:root{
  --bg:#f3f5f9; --panel:#ffffff; --panel2:#f7f9fc; --fg:#172033; --muted:#647089; --line:#e1e6ef;
  --accent:#2457d6; --accent-fg:#ffffff; --accent-soft:#e7eefc;
  --good:#15803d; --good-soft:#dcfce7; --bad:#c62828; --bad-soft:#fde4e4; --warn:#b45309; --warn-soft:#fdf0d5;
  --shadow:0 10px 30px rgba(15,25,50,.18); --overlay:rgba(12,18,32,.5);
  --f-body:-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif; --f-head:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131d; --panel:#161d2a; --panel2:#1b2332; --fg:#e7ecf5; --muted:#93a0b8; --line:#273145;
  --accent:#6b93f5; --accent-fg:#0b1220; --accent-soft:#1d2a47;
  --good:#4ade80; --good-soft:#123222; --bad:#f87171; --bad-soft:#3a1717; --warn:#fbbf24; --warn-soft:#3a2c0c;
  --shadow:0 10px 30px rgba(0,0,0,.5); --overlay:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131d; --panel:#161d2a; --panel2:#1b2332; --fg:#e7ecf5; --muted:#93a0b8; --line:#273145;
  --accent:#6b93f5; --accent-fg:#0b1220; --accent-soft:#1d2a47;
  --good:#4ade80; --good-soft:#123222; --bad:#f87171; --bad-soft:#3a1717; --warn:#fbbf24; --warn-soft:#3a2c0c;
  --shadow:0 10px 30px rgba(0,0,0,.5); --overlay:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
header.top .shop{font-family:var(--f-head);font-weight:700;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#saveStatus{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--good)} .dot.busy{background:var(--warn)} .dot.err{background:var(--bad)}
main{max-width:1000px;margin:0 auto;padding-block:16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-head);font-size:22px;margin:0 0 14px;text-wrap:balance}
h2{font-family:var(--f-head);font-size:16px;margin:0 0 10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 11px var(--f-body);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .grow{flex:1}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:10px 14px;font:600 14px var(--f-body);cursor:pointer;white-space:nowrap;min-height:40px}
.btn:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.sec{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.btn.green{background:var(--good);color:var(--panel)} .btn.red{background:var(--bad);color:var(--panel)}
.btn.sm{padding:6px 10px;font-size:13px;min-height:32px;border-radius:8px}
.btn.block{width:100%}
input,select,textarea{font:16px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stat .v{font-family:var(--f-head);font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .s{color:var(--muted);font-size:12px;margin-top:2px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.card .tablewrap{border:0;border-radius:0}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{background:var(--panel2);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .pos{color:var(--good);font-weight:600} .neg{color:var(--bad);font-weight:600} .warn{color:var(--warn);font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.badge.red{background:var(--bad-soft);color:var(--bad)} .badge.green{background:var(--good-soft);color:var(--good)} .badge.orange{background:var(--warn-soft);color:var(--warn)}
.actions{white-space:nowrap;text-align:end}
.actions .btn{margin:2px 0}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin:0 0 12px}
/* Tableaux en cartes sur téléphone */
@media(max-width:700px){
  .tablewrap{overflow:visible;background:none;border:0}
  .tablewrap table,.tablewrap tbody,.tablewrap tr,.tablewrap td{display:block;width:100%}
  .tablewrap thead{display:none}
  .tablewrap tr{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:6px 12px}
  .card .tablewrap tr{background:var(--panel2)}
  .tablewrap td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:12px;text-align:end;align-items:center}
  .tablewrap td::before{content:attr(data-label);color:var(--muted);font-size:12px;text-align:start;flex-shrink:0;font-weight:600}
  .tablewrap td[data-label=""]::before{display:none}
  .tablewrap td.first{font-size:15px;justify-content:flex-start;text-align:start;display:block}
  .tablewrap td.first::before{display:none}
  .tablewrap td.actions{justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
  .tablewrap td.actions::before{display:none}
  .items td{display:block!important;text-align:start!important}
  .items td::before{display:block!important;margin-bottom:4px}
}
/* Modal */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.overlay[hidden]{display:none!important}
.box{background:var(--panel);border-radius:16px;width:100%;max-width:640px;box-shadow:var(--shadow)}
.box.wide{max-width:1000px}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);border-radius:16px 16px 0 0;z-index:2}
.mhead h3{margin:0;font:700 17px var(--f-head)}
.mhead button{background:none;border:0;font-size:28px;line-height:1;cursor:pointer;color:var(--muted);width:40px;height:40px}
#mbody{padding:16px}
@media(max-width:700px){
  #modal{padding:0}
  #modal .box{border-radius:0;min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  #modal .mhead{border-radius:0}
}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form>*,.totals>*{min-width:0}
.row>select,.row>input{flex:1;min-width:0}
select{max-width:100%;text-overflow:ellipsis}
#mbody{overflow-x:hidden}
@media(max-width:560px){.form{grid-template-columns:1fr}}
label.l,.form label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.row{display:flex;gap:6px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px;align-items:end}
.totals .big{font:700 20px var(--f-head);font-variant-numeric:tabular-nums}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
@media(max-width:560px){.mfoot .btn{flex:1}}
/* Dialogue */
#dlg{z-index:70;align-items:center}
#dlg .box{max-width:400px;padding:18px}
#dmsg{margin:0 0 14px;white-space:pre-line;line-height:1.45}
#dinput{margin-bottom:14px}
/* Plus */
.morelist{display:grid;gap:8px}
.morelist button{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;font:600 15px var(--f-body);color:var(--fg);cursor:pointer;text-align:start}
.morelist button small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.morelist svg{width:22px;height:22px;color:var(--accent);flex-shrink:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;max-width:calc(100% - 32px)}
/* Facture (papier, toujours clair) */
.inv{background:#fff;color:#111;padding:18px;border:1px solid var(--line);border-radius:10px;font:13px Arial,sans-serif;overflow-x:auto}
.inv table{min-width:420px}
.inv th{background:#eee;color:#111}
.inv th,.inv td{border-bottom:1px solid #ddd;color:#111}
@media(prefers-reduced-motion:no-preference){.btn{transition:filter .15s}.btn:active{filter:brightness(.92)}}
/* ================= Nouveau design : style app iOS, carte « caisse » en haut, listes groupées ================= */
:root{
  --bg:#f2f3f7; --panel:#ffffff; --panel2:#f6f7fb; --fg:#11162a; --muted:#6b7187; --line:#e7e9f0;
  --accent:#3b4fe4; --accent-2:#6a4cf0; --accent-fg:#ffffff; --accent-soft:#eceefe;
  --hero-1:#2b3cd6; --hero-2:#6a3fe8; --hero-fg:#ffffff;
  --shadow:0 1px 2px rgba(17,22,42,.04),0 6px 20px rgba(17,22,42,.06);
  --radius:18px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0d14; --panel:#161925; --panel2:#1c2030; --fg:#eef0f8; --muted:#9aa0b8; --line:#262a3b;
  --accent:#8193ff; --accent-2:#a28bff; --accent-fg:#0b0d14; --accent-soft:#22274a; --hero-1:#2a37a8; --hero-2:#5636b8; --hero-fg:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{
  --bg:#0b0d14; --panel:#161925; --panel2:#1c2030; --fg:#eef0f8; --muted:#9aa0b8; --line:#262a3b;
  --accent:#8193ff; --accent-2:#a28bff; --accent-fg:#0b0d14; --accent-soft:#22274a; --hero-1:#2a37a8; --hero-2:#5636b8; --hero-fg:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}
body{font-size:16px;letter-spacing:-.01em}
body::before{background:var(--bg)}
header.top{background:var(--bg);border-bottom:0;padding-block:12px}
header.top .shop{font-size:15px;font-weight:600;color:var(--muted)}
#langBtn{border-radius:99px;min-width:40px;min-height:34px;font-weight:700;background:var(--panel);box-shadow:var(--shadow);border:0}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:4px 0 16px}
h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.card,.stat,.tablewrap{border:0;border-radius:var(--radius);box-shadow:var(--shadow)}
.card{padding:16px}
.btn{border-radius:12px;min-height:44px;font-weight:600;padding:10px 16px}
.btn.sm{border-radius:99px;min-height:32px;padding:6px 12px;font-size:13px}
.btn.sec{border:0;background:var(--panel);box-shadow:var(--shadow)}

.note{font-size:14px}
.banner{border-radius:14px;font-size:14px}
/* Barre d'onglets */
nav.tabs{background:var(--panel);border-top:1px solid var(--line)}
nav.tabs button{font-size:10.5px;font-weight:600;position:relative}
nav.tabs button.on svg{stroke-width:2.4}
nav.tabs button.on::after{content:"";position:absolute;top:6px;width:28px;height:3px;border-radius:3px;background:var(--accent)}
/* Carte caisse (accueil) */
.hero{background:linear-gradient(135deg,var(--hero-1),var(--hero-2));color:var(--hero-fg);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 12px 30px color-mix(in srgb,var(--hero-1) 35%,transparent)}

.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script type="text/plain" id="gsCode">// MaBoutique — sauvegarde automatique de l'application dans Google Sheets

var KEY = "__KEY__";

function doPost(e) {
  var p;

    var ss = SHEET_ID ? SpreadsheetApp.openById(SHEET_ID) : SpreadsheetApp.getActiveSpreadsheet();

function out(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }

function writeSheet(ss, t, idx, at, rtl) {

  sh.setRowHeight(1, 46);
  var when = Utilities.formatDate(new Date(at || Date.now()), "Africa/Casablanca", "dd/MM/yyyy HH:mm");

  sh.getRange(3, 1, 1, W).setBackground(GREEN); sh.setRowHeight(3, 4);

  var r = 5, rules = [];
  t.sections.forEach(function (s) {
    var n = s.cols.length;
    if (s.title) {
      sh.getRange(r, 1, 1, n).merge().setValue(s.title).setFontWeight("bold").setFontSize(13)
        .setFontColor(C1).setBackground(CHIP).setVerticalAlignment("middle");
      sh.setRowHeight(r, 30); r++;
    }
    var hr = r;
    sh.getRange(r, 1, 1, n).setValues([s.cols.map(function (c) { return c.h; })])
      .setFontColor("#ffffff").setFontWeight("bold").setHorizontalAlignment("center").setVerticalAlignment("middle").setWrap(true);
    sh.setRowHeight(r, 36); r++;
    if (!s.rows.length) {
      sh.getRange(hr, 1, 1, n).setBackground(C2);
      sh.getRange(r, 1, 1, n).merge().setValue(rtl ? "— ما كاين والو —" : "— Aucune donnée —").setFontColor(MUTED).setHorizontalAlignment("center");
      r += 3; return;
    }
    var rows = s.rows.map(function (row) {
      return s.cols.map(function (c, j) {
        var v = row[j];
        if (v === null || v === undefined) return "";
        if (c.t === "date" && v) { var d = new Date(v + "T12:00:00"); return isNaN(d) ? v : d; }
        return v;
      });
    });
    var r0 = r, len = rows.length;
    sh.getRange(r, 1, len, n).setValues(rows).setVerticalAlignment("middle");
    s.cols.forEach(function (c, j) {
      var col = sh.getRange(r0, j + 1, len, 1);
      if (c.t === "money") {
        col.setNumberFormat('#,##0.00" DH";-#,##0.00" DH";"—"').setHorizontalAlignment("center").setFontWeight("bold");
        rules.push(SpreadsheetApp.newConditionalFormatRule().whenNumberLessThan(0).setFontColor(RED).setRanges([col]).build());
      } else if (c.t === "num") {
        col.setNumberFormat("#,##0.##").setHorizontalAlignment("center");
      } else if (c.t === "date") {
        col.setNumberFormat("dd/MM/yyyy").setHorizontalAlignment("center");
      } else {
        col.setWrap(true);
      }
      if (c.c) col.setFontColor(c.c);
    });
    r += len;
    if (s.total) {
      var tr = sh.getRange(r, 1, 1, n);
      tr.setFontColor("#ffffff").setFontWeight("bold").setHorizontalAlignment("center");
      sh.getRange(r, 1).setValue(rtl ? "المجموع" : "TOTAL");
      s.cols.forEach(function (c, j) {
        if (j > 0 && c.sum) {
          var cell = sh.getRange(r, j + 1);

        }
      });
      sh.setRowHeight(r, 32); r++;
    }
    var band = sh.getRange(hr, 1, r - hr, n).applyRowBanding(SpreadsheetApp.BandingTheme.BLUE, true, !!s.total)
      .setHeaderRowColor(C2).setFirstRowColor("#ffffff").setSecondRowColor(BAND);
    if (s.total) band.setFooterRowColor(GREEN);
    sh.getRange(hr, 1, r - hr, n).setBorder(true, true, true, true, true, true, LINE, SpreadsheetApp.BorderStyle.SOLID);
    r += 2;
  });
  sh.setConditionalFormatRules(rules);
  sh.setFrozenRows(3);

  var keep = Math.max(r + 5, 20);

}

  if (LANG !== 'ar' || !root) return;

  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => { const p = n.parentNode && n.parentNode.nodeName; if (p === 'SCRIPT' || p === 'STYLE' || p === 'TEXTAREA') return; const t = tr(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; });
  root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(e => ['placeholder', 'aria-label', 'title'].forEach(a => { if (e.hasAttribute(a)) e.setAttribute(a, tr(e.getAttribute(a))); }));
}

let dlgResolve = null;
function dialog({msg, input = false, ph = '', ok = 'OK', cancel = 'Annuler', danger = false, secret = false}) {
  return new Promise(res => {
    if (dlgResolve) dlgResolve({ok:false});
    dlgResolve = res;
    $('#dmsg').textContent = tr(msg); ok = tr(ok); cancel = cancel && tr(cancel);
    const inp = $('#dinput'); inp.hidden = !input; inp.value = ''; inp.placeholder = ph;
    inp.type = secret ? 'password' : 'text'; inp.autocomplete = secret ? 'new-password' : 'off';
    $('#dok').textContent = ok; $('#dok').className = 'btn' + (danger ? ' red' : '');
    $('#dcancel').hidden = !cancel; $('#dcancel').textContent = cancel || '';
    $('#dlg').hidden = false;
    setTimeout(() => (input ? inp : $('#dok')).focus(), 30);
  });
}
function closeDlg(ok) { $('#dlg').hidden = true; const r = dlgResolve; dlgResolve = null; if (r) r({ok, value: $('#dinput').value.trim()}); }
$('#dok').onclick = () => closeDlg(true);
$('#dcancel').onclick = () => closeDlg(false);

  try { localStorage.setItem(userKey(), JSON.stringify(db)); } catch (e) { setS('error'); return uiAlert('Enregistrement impossible : ' + e.message); }
  if (sb && user) { setS('saving'); clearTimeout(pushTimer); pushTimer = setTimeout(push, 800); } else setS('saved');
  queueSheet();
}
async function push() {
  if (!sb || !user) return;
  if (pushing) { pushAgain = true; return; }
  pushing = true; pushTimer = null; setS('saving');
  let error = null;
  try { ({error} = await sb.from('shops').upsert({user_id: user.id, data: db, updated_at: new Date().toISOString()})); } catch (e) { error = e; }
  pushing = false;
  if (error) console.warn(error);
  setS(error ? (navigator.onLine === false ? 'offline' : 'error') : 'saved');
  if (pushAgain) { pushAgain = false; push(); }
}
window.addEventListener('online', () => { if (['offline', 'error'].includes(sState)) push(); });
async function pull() {
  let res;
  try { res = await sb.from('shops').select('data').eq('user_id', user.id).maybeSingle(); } catch (e) { res = {error: e}; }
  if (res.error) { setS(navigator.onLine === false ? 'offline' : 'error'); return; }
  const remote = res.data && res.data.data;
  if (remote && remote.products && (remote.savedAt || 0) >= (db.savedAt || 0)) {
    db = normalize(remote); try { localStorage.setItem(userKey(), JSON.stringify(db)); } catch (e) {}
    setS('saved'); render();
  } else if (hasData(db) || (remote && !remote.products)) push();
  else if (!remote) push();
  else setS('saved');
}
async function startUser(u, shopName) {
  user = u;
  try { db = normalize(JSON.parse(localStorage.getItem(userKey()))); } catch (e) { db = emptyDB(); }
  // Données créées avant les comptes sur ce téléphone : le premier compte connecté les reprend.
  if (!hasData(db)) {
    try { const old = JSON.parse(localStorage.getItem(KEY)); if (old && old.products && hasData(normalize(old))) { db = normalize(old); db.savedAt = 1; localStorage.setItem(userKey(), JSON.stringify(db)); localStorage.removeItem(KEY); } } catch (e) {}
  }
  hideAuth(); render();
  await pull();
  const name = shopName || (u.user_metadata && u.user_metadata.shop_name);
  if (name && (!db.settings.shopName || db.settings.shopName === 'Mon Magasin PC')) { db.settings.shopName = name; save(); render(); }
}

/* ---------- Accès ---------- */
const prod = id => db.products.find(p => p.id === id);
const client = id => db.clients.find(c => c.id === id);
const supplier = id => db.suppliers.find(s => s.id === id);
const party = (type, id) => type === 'client' ? client(id) : supplier(id);
const pLabel = p => p ? p.name + ([p.cpu, p.ram, p.storage].filter(Boolean).length ? ' · ' + [p.cpu, p.ram, p.storage].filter(Boolean).join(' / ') : '') : '(produit supprimé)';
function clientBalance(id) {
  const c = client(id); if (!c) return 0;
  return r2(num(c.opening) + sum(db.sales.filter(s => s.clientId === id), s => s.total - s.paid) - sum(db.payments.filter(p => p.type === 'client' && p.partyId === id), p => p.amount));
}
function supplierBalance(id) {
  const s = supplier(id); if (!s) return 0;
  return r2(num(s.opening) + sum(db.purchases.filter(p => p.supplierId === id), p => p.total - p.paid) - sum(db.payments.filter(p => p.type === 'supplier' && p.partyId === id), p => p.amount));
}
const balance = (type, id) => type === 'client' ? clientBalance(id) : supplierBalance(id);
const saleProfit = s => sum(s.items, i => (i.price - i.cost) * i.qty) - num(s.discount);

async function offerFile(filename, data) {
  const type = filename.endsWith('.json') ? 'application/json' : 'text/html';
  const file = new File([data], filename, {type});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:filename}); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Fichier prêt'); return true;
}

// Recherche : on attend une petite pause dans la frappe avant de redessiner la page (sinon l'app rame sur iPhone)
let filterTimer = null;
const limits = {}, PAGE = 50;
function setFilter(k, v) {
  filters[k] = v; limits[k] = 0;
  clearTimeout(filterTimer);
  filterTimer = setTimeout(() => {
    const old = document.getElementById('search'), pos = old ? old.selectionStart : null;
    render();
    const el = document.getElementById('search'); if (el) { el.focus(); try { const c = pos ?? el.value.length; el.setSelectionRange(c, c); } catch (e) {} }
  }, 180);
}
function showMore(k) { limits[k] = (limits[k] || PAGE) + PAGE; render(); }

function searchBox(k, ph) { return `<input id="search" class="search" type="search" placeholder="${ph || 'Rechercher...'}" value="${esc(filters[k] || '')}" oninput="setFilter('${k}', this.value)">`; }
/* Recherche : chaque mot doit être trouvé ; un nombre cherche aussi dans les prix (« 32 » trouve 3200, « 3 200 » et « 3200,00 » marchent) */
const foldTxt = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const searchWords = q => foldTxt(q).replace(/(\d)[\s  .]+(?=\d{3}(?!\d))/g, '$1').trim().split(/\s+/).filter(Boolean);
const priceHit = (w, prices) => { const m = w.replace(',', '.').match(/^\d+(\.\d+)?$/); if (!m) return false; const n = parseFloat(m[0]); return prices.some(p => { p = Math.abs(num(p)); return p === n || String(Math.round(p)).startsWith(w.split(/[.,]/)[0]) && !/[.,]/.test(w); }); };
const textMatch = (q, text, prices = []) => { const h = foldTxt(text); return searchWords(q).every(w => h.includes(w) || priceHit(w, prices)); };
const match = (k, text, prices = []) => textMatch(filters[k] || '', text, prices);
function table(head, rows, emptyMsg) {
  if (!rows.length) return `<div class="tablewrap"><div class="empty">${emptyMsg || 'Aucune donnée'}</div></div>`;
  return `<div class="tablewrap"><table><thead><tr>${head.map(h => `<th class="${h.startsWith('#') ? 'n' : ''}">${h.replace(/^#/, '')}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
function balBadge(b) {
  if (Math.abs(b) < 0.01) return '<span class="badge green">Soldé</span>';
  if (b > 0) return `<span class="neg">${fmt(b)}</span>`;
  return `<span class="pos">${fmt(-b)} d'avance</span>`;
}

/* ---------- CLIENTS / FOURNISSEURS ---------- */

  const rows = list.map(x => ({x, b:balance(type, x.id)})).filter(r => match(k, [r.x.name, r.x.phone, r.x.cin, r.x.address].join(' '), [r.b]) && (!only || r.b > 0.009)).sort((a, b) => a.x.name.localeCompare(b.x.name));

  }), isC ? 'Aucun client' : 'Aucun fournisseur')}`;
}
views.clients = () => partyView('client');
views.suppliers = () => partyView('supplier');
function editParty(type, id) {
  const isC = type === 'client', x = id ? party(type, id) : {};

function saveParty(type, id) {
  const name = val('f_name'); if (!name) return uiAlert('Le nom est obligatoire.');

  if (id) Object.assign(party(type, id), data); else (type === 'client' ? db.clients : db.suppliers).push({id:uid(), ...data});

}
async function deleteParty(type, id) {
  const used = type === 'client' ? db.sales.some(s => s.clientId === id) : db.purchases.some(p => p.supplierId === id);
  if (used || db.payments.some(p => p.partyId === id)) return uiAlert('Impossible de supprimer : des opérations sont liées à ce nom.');
  if (!await uiConfirm('Supprimer ?', 'Supprimer', true)) return;
  if (type === 'client') db.clients = db.clients.filter(c => c.id !== id); else db.suppliers = db.suppliers.filter(s => s.id !== id);
  save(); render();
}
function statementRows(type, id) {
  const x = party(type, id), isC = type === 'client', rows = [];
  if (num(x.opening)) rows.push({d:'', l:isC ? 'Crédit d\'avant' : 'Dette d\'avant', deb:num(x.opening), cred:0});
  (isC ? db.sales.filter(s => s.clientId === id) : db.purchases.filter(p => p.supplierId === id)).forEach(o => {
    rows.push({d:o.date, l:(isC ? 'Vente ' : 'Achat ') + o.num + ' – ' + o.items.map(i => i.qty + '× ' + i.name).join(', '), deb:o.total, cred:0});
    if (o.paid > 0) rows.push({d:o.date, l:'Payé à la ' + (isC ? 'vente ' : 'réception ') + o.num, deb:0, cred:o.paid});
  });
  db.payments.filter(p => p.type === type && p.partyId === id).forEach(p => rows.push({d:p.date, l:'Paiement (' + p.method + ')' + (p.note ? ' – ' + p.note : ''), deb:0, cred:p.amount}));
  rows.sort((a, b) => a.d.localeCompare(b.d));
  let run = 0; rows.forEach(r => { run = r2(run + r.deb - r.cred); r.bal = run; });
  return rows;
}
function statement(type, id) {
  const x = party(type, id), isC = type === 'client', b = balance(type, id);
  openModal('Relevé – ' + x.name, `<p style="margin:0 0 12px">${x.phone ? esc(x.phone) + ' · ' : ''}<span class="muted">${isC ? 'Reste à encaisser' : 'Reste à payer'} :</span> ${balBadge(b)}</p>

    ${table(['Date', 'Opération', '#' + (isC ? 'Doit' : 'Acheté'), '#Payé', '#Solde'], statementRows(type, id).map(r => `<tr><td>${fdate(r.d) || '—'}</td><td>${esc(r.l)}</td><td class="n">${r.deb ? fmt(r.deb) : ''}</td><td class="n pos">${r.cred ? fmt(r.cred) : ''}</td><td class="n ${r.bal > 0 ? 'neg' : ''}">${fmt(r.bal)}</td></tr>`), 'Aucune opération')}`, true);
}

async function quickParty() {

function refreshItems() { $('#items').innerHTML = itemsHTML(); translate($('#items')); labelTables($('#mbody')); blankZeros($('#items')); }

/* ---------- Recherche de produit (remplace la longue liste déroulante) ---------- */
let pickRow = -1, pickCat = '';
function pickCatSet(b) { pickCat = b.dataset.cat; document.querySelectorAll('#pickcats .chipbtn').forEach(x => x.classList.toggle('on', x === b)); pickRender(); }
const PICK_IC = {
  'PC Portable': '<rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 19h20"/>',
  'PC Bureau': '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  'Écran': '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  'Accessoire': '<rect x="7" y="3" width="10" height="18" rx="5"/><path d="M12 7v3"/>',
  'Pièce détachée': '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  '': '<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/>'
};
const pickIcon = c => `<span class="pickic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PICK_IC[c] || PICK_IC['']}</svg></span>`;
const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function openPicker(i) {
  pickRow = i;
  let el = $('#pick');
  if (!el) {
    el = document.createElement('div'); el.id = 'pick'; el.className = 'overlay';
    el.onclick = e => { if (e.target === el) closePicker(); };
    document.body.appendChild(el);
  }
  pickCat = '';
  const cats = [...new Set(db.products.map(p => p.category).filter(Boolean))];
  el.innerHTML = `<div class="box pickbox" role="dialog" aria-modal="true" aria-labelledby="picktitle">
    <div class="pickhead">
      <div class="picktop"><h3 id="picktitle">${L('Choisir un produit', 'اختار منتوج')}</h3><button type="button" class="pickx" onclick="closePicker()" aria-label="${L('Fermer', 'سد')}">×</button></div>
      <input id="pickq" class="search" type="search" autocomplete="off" enterkeyhint="search" placeholder="${L('Nom, marque, prix...', 'السمية، الماركة، الثمن...')}" oninput="pickRender()" onkeydown="if(event.key==='Enter'){event.preventDefault();pickFirst()}">
      ${cats.length > 1 ? `<div class="pickcats" id="pickcats">${['', ...cats].map(c => `<button type="button" class="chipbtn${c === '' ? ' on' : ''}" data-cat="${esc(c)}" onclick="pickCatSet(this)">${c ? esc(tr(c)) : L('Tous', 'الكل')}</button>`).join('')}</div>` : ''}
      <div class="pickcount" id="pickcount"></div>
    </div>
    <div id="picklist" class="picklist"></div></div>`;
  el.hidden = false; pickRender();
  setTimeout(() => { const q = $('#pickq'); if (q) q.focus(); }, 30);
}
function closePicker() { const el = $('#pick'); if (el) { el.hidden = true; el.innerHTML = ''; } pickRow = -1; }
function pickMatches() {
  const isS = draft.kind === 'sale', q = $('#pickq')?.value || '';
  return db.products
    .filter(p => (!pickCat || p.category === pickCat) && textMatch(q, [pLabel(p), p.category, tr(p.category || ''), p.condition, p.brand].join(' '), [p.sell, p.buy]))
    .sort((a, b) => (isS ? (b.qty > 0) - (a.qty > 0) : 0) || a.name.localeCompare(b.name));
}
function pickRender() {
  if (!draft) return closePicker();
  const isS = draft.kind === 'sale', list = pickMatches(), cur = draft.items[pickRow]?.productId;
  const row = p => {
    const out = isS && p.qty <= 0 && p.id !== cur;
    const specs = [p.cpu, p.ram, p.storage].filter(Boolean).map(esc).join(' · ');
    const meta = [p.category && tr(p.category), p.condition && tr(p.condition)].filter(Boolean).map(esc).join(' · ');
    const low = p.qty > 0 && p.qty <= (p.minQty || 0);
    return `<button type="button" class="pickrow${p.id === cur ? ' on' : ''}" ${out ? 'disabled' : ''} onclick="pickSet('${p.id}')">
      ${pickIcon(p.category)}
      <span class="pickmain"><b>${esc(p.name)}</b>${specs ? `<span class="pickspec">${specs}</span>` : ''}${meta ? `<small>${meta}</small>` : ''}</span>
      <span class="pickside"><b>${fmt(isS ? p.sell : p.buy)}</b><span class="pickstock ${p.qty <= 0 ? 'out' : low ? 'low' : 'ok'}">${p.qty > 0 ? L('Stock', 'المخزون') + ' ' + p.qty : L('Épuisé', 'سالي')}</span></span></button>`;
  };
  const add = !isS ? `<button type="button" class="pickrow pickadd" onclick="pickSet('__new')"><span class="pickic">+</span><span class="pickmain"><b>${L('Nouveau produit', 'منتوج جديد')}</b><small>${L('Le produit n\'existe pas encore', 'المنتوج ما كاينش باقي')}</small></span></button>` : '';
  const n = list.length;
  $('#pickcount').textContent = n === 1 ? L('1 produit', 'منتوج واحد') : L(n + ' produits', n + ' منتوجات');
  $('#picklist').innerHTML = add + (n ? list.map(row).join('') : `<div class="pickempty"><b>${L('Aucun produit trouvé', 'ما لقينا حتى منتوج')}</b><span>${L('Essayez un autre mot ou une autre catégorie.', 'جرب كلمة أخرى ولا نوع آخر.')}</span></div>`);
}
function pickFirst() { const b = $('#picklist .pickrow:not([disabled]):not(.pickadd)') || $('#picklist .pickadd'); if (b) b.click(); }
function pickSet(id) { const i = pickRow; closePicker(); if (i < 0 || !draft) return; itemSet(i, 'productId', id); }
function itemSet(i, f, v) {
  const it = draft.items[i];
  if (f === 'productId') { it.productId = v; const p = prod(v); it.price = p ? (draft.kind === 'sale' ? p.sell : p.buy) : 0; refreshItems(); }
  else it[f] = f === 'qty' ? Math.max(1, num(v) || 1) : ['price', 'newSell'].includes(f) ? num(v) : v;
  const lt = document.getElementById('lt' + i); if (lt) lt.textContent = fmt(it.qty * it.price);
  updateTotals();
}
function addItem() { draft.items.push(draft.kind === 'sale' ? {productId:'', qty:1, price:0, serial:''} : newPItem()); refreshItems(); }
function removeItem(i) { draft.items.splice(i, 1); if (!draft.items.length) return addItem(); refreshItems(); updateTotals(); }
const draftTotal = () => r2(sum(draft.items, i => i.qty * i.price) - (draft.kind === 'sale' ? num(draft.discount) : 0));
function payAll() { draft.paid = draftTotal(); $('#d_paid').value = draft.paid; updateTotals(); }
function updateTotals() {
  if (!draft || !$('#d_total')) return;
  const t = draftTotal(), rest = r2(t - draft.paid);
  $('#d_total').textContent = fmt(t);
  $('#d_rest').innerHTML = `<span class="${rest > 0.009 ? 'neg' : 'pos'}">${fmt(rest)}</span>`;
  let info = '';
  if (draft.kind === 'sale') {
    const profit = sum(draft.items, i => { const p = prod(i.productId); return p ? (i.price - p.buy) * i.qty : 0; }) - num(draft.discount);
    info = `Bénéfice estimé : <b class="${profit >= 0 ? 'pos' : 'neg'}">${fmt(profit)}</b>`;
    if (draft.clientId) info += ` · Crédit actuel du client : <b>${fmt(clientBalance(draft.clientId))}</b>`;
  }
  $('#d_info').innerHTML = info; translate($('#d_info'));
}
function saveSale() {
  const items = draft.items.filter(i => i.productId);
  if (!items.length) return uiAlert('Ajoutez au moins un produit.');
  const need = {};
  for (const i of items) { if (i.qty <= 0) return uiAlert('Quantité invalide.'); need[i.productId] = (need[i.productId] || 0) + i.qty; }
  for (const id in need) { const p = prod(id); if (need[id] > p.qty) return uiAlert(`Stock insuffisant pour « ${p.name} » (disponible : ${p.qty}).`); }
  const total = draftTotal(), paid = r2(draft.paid);
  if (total < 0) return uiAlert('Le total ne peut pas être négatif. Vérifiez la remise.');
  if (paid > total + 0.009) return uiAlert('Le montant payé dépasse le total.');
  if (total - paid > 0.009 && !draft.clientId) return uiAlert('Il reste un montant non payé. Choisissez un client (ou ajoutez-le avec +) pour enregistrer le crédit.');
  db.seq.sale++;
  const s = {id:uid(), num:'V-' + String(db.seq.sale).padStart(4, '0'), date:validDate(draft.date), clientId:draft.clientId || null,
    items:items.map(i => { const p = prod(i.productId); return {productId:p.id, name:pLabel(p), qty:i.qty, price:i.price, cost:p.buy, serial:i.serial}; }),
    discount:num(draft.discount), total, paid, method:draft.method, notes:draft.notes};
  items.forEach(i => prod(i.productId).qty -= i.qty);
  db.sales.push(s); save(); closeModal(); render(); toast('Vente ' + s.num + ' enregistrée');
  showSale(s.id);
}
function savePurchase() {
  if (!draft.supplierId) return uiAlert('Choisissez un fournisseur (ou ajoutez-le avec +).');
  const items = draft.items.filter(i => i.productId);
  if (!items.length) return uiAlert('Ajoutez au moins un produit.');
  for (const i of items) { if (i.qty <= 0) return uiAlert('Quantité invalide.'); if (i.productId === '__new' && !i.newName.trim()) return uiAlert('Donnez une désignation au nouveau produit.'); }
  const total = draftTotal(), paid = r2(draft.paid);
  if (paid > total + 0.009) return uiAlert('Le montant payé dépasse le total.');
  const recItems = items.map(i => {
    let p;
    if (i.productId === '__new') { p = {id:uid(), name:i.newName.trim(), category:i.newCat, condition:i.newCond, qty:0, buy:i.price, sell:i.newSell || i.price, minQty:1}; db.products.push(p); }
    else p = prod(i.productId);
    const oldQty = Math.max(0, p.qty);
    p.buy = oldQty + i.qty > 0 ? r2((oldQty * p.buy + i.qty * i.price) / (oldQty + i.qty)) : i.price; // coût moyen
    p.qty += i.qty;
    return {productId:p.id, name:pLabel(p), qty:i.qty, price:i.price};
  });
  db.seq.purchase++;
  db.purchases.push({id:uid(), num:'A-' + String(db.seq.purchase).padStart(4, '0'), date:validDate(draft.date), supplierId:draft.supplierId, items:recItems, total, paid, method:draft.method, notes:draft.notes});
  save(); closeModal(); render(); toast('Achat enregistré, stock mis à jour');
}

function payShowBal(type) {

views.reports = () => {
  const from = rep.from || today().slice(0, 8) + '01', to = rep.to || today(), inR = d => d >= from && d <= to;
  const S = db.sales.filter(s => inR(s.date)), A = db.purchases.filter(a => inR(a.date)), E = db.expenses.filter(e => inR(e.date)), P = db.payments.filter(p => inR(p.date));
  const ca = sum(S, s => s.total), cost = sum(S, s => sum(s.items, i => i.cost * i.qty)), gross = sum(S, saleProfit), exp = sum(E, e => e.amount);
  const cashIn = sum(S, s => s.paid) + sum(P.filter(p => p.type === 'client'), p => p.amount);
  const cashOut = sum(A, a => a.paid) + sum(P.filter(p => p.type === 'supplier'), p => p.amount) + exp;
  const top = {};
  S.forEach(s => s.items.forEach(i => { const k = i.productId; top[k] = top[k] || {name:i.name, q:0, ca:0, pr:0}; top[k].q += i.qty; top[k].ca += i.qty * i.price; top[k].pr += (i.price - i.cost) * i.qty; }));
  const topL = Object.values(top).sort((a, b) => b.pr - a.pr).slice(0, 15);
  const byCat = {}; E.forEach(e => byCat[e.category] = (byCat[e.category] || 0) + e.amount);
  return `<h1>Rapports</h1>
  <div class="toolbar"><input id="repFrom" type="date" style="max-width:170px" value="${from}" onchange="rep.from=this.value;render()"><span class="muted">au</span><input id="repTo" type="date" style="max-width:170px" value="${to}" onchange="rep.to=this.value;render()"></div>
  <div class="toolbar"><button class="btn sec sm" onclick="rep.from=today();rep.to=today();render()">Aujourd'hui</button>
  <button class="btn sec sm" onclick="rep.from=today().slice(0,8)+'01';rep.to=today();render()">Ce mois</button>
  <button class="btn sec sm" onclick="rep.from=today().slice(0,5)+'01-01';rep.to=today();render()">Cette année</button></div>
  <div class="stats">
    <div class="stat"><div class="l">Chiffre d'affaires</div><div class="v">${fmt(ca)}</div><div class="s">${S.length} vente(s)</div></div>
    <div class="stat"><div class="l">Coût des produits vendus</div><div class="v">${fmt(cost)}</div></div>
    <div class="stat"><div class="l">Bénéfice brut</div><div class="v pos">${fmt(gross)}</div></div>
    <div class="stat"><div class="l">Dépenses</div><div class="v neg">${fmt(exp)}</div></div>
    <div class="stat"><div class="l">Bénéfice net</div><div class="v ${gross - exp >= 0 ? 'pos' : 'neg'}">${fmt(gross - exp)}</div></div>
    <div class="stat"><div class="l">Achats</div><div class="v">${fmt(sum(A, a => a.total))}</div><div class="s">${A.length} achat(s)</div></div>
    <div class="stat"><div class="l">Argent entré</div><div class="v pos">${fmt(cashIn)}</div><div class="s">ventes + crédits encaissés</div></div>
    <div class="stat"><div class="l">Argent sorti</div><div class="v neg">${fmt(cashOut)}</div><div class="s">fournisseurs + dépenses</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Produits les plus rentables</h2>${table(['Produit', '#Qté', '#CA', '#Bénéfice'], topL.map(t => `<tr><td>${esc(t.name)}</td><td class="n">${t.q}</td><td class="n">${fmt(t.ca)}</td><td class="n pos">${fmt(t.pr)}</td></tr>`), 'Aucune vente sur la période')}</div>
    <div class="card"><h2>Dépenses par catégorie</h2>${table(['Catégorie', '#Montant'], Object.entries(byCat).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${fmt(v)}</td></tr>`), 'Aucune dépense sur la période')}</div>

};

let shT = null, shBusy = false, shAgain = false, shSt = {state: '', at: 0, msg: ''};
function queueSheet() { const s = db.settings.sheet; if (!s || !s.url) return; clearTimeout(shT); shT = setTimeout(() => sendSheet(false), 4000); }
function setShSt(state, msg) { shSt = {state, msg: msg || '', at: Date.now()}; const el = document.getElementById('shStatus'); if (el) { el.innerHTML = shStatusHtml(); translate(el); } }
function shStatusHtml() {
  const s = db.settings.sheet || {}, time = shSt.at ? new Date(shSt.at).toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'}) : '';
  if (!s.url) return `<span class="badge">${L('Pas encore reliée', 'ما زال ما مربوطة')}</span>`;
  if (shSt.state === 'sending') return `<span class="badge orange">${L('Envoi en cours…', 'كيتصيفط…')}</span>`;
  if (shSt.state === 'ok') return `<span class="badge green">${L('À jour', 'محدثة')} · ${time}</span>`;
  if (shSt.state === 'sent') return `<span class="badge">${L('Envoyée', 'تصيفطات')} · ${time}</span>`;
  if (shSt.state === 'err') return `<span class="badge red">${esc(shSt.msg)}</span>`;
  return `<span class="badge green">${L('Reliée · mise à jour automatique', 'مربوطة · كتحدث بوحدها')}</span>`;
}
async function sendSheet(manual) {
  const s = SH();
  if (!s.url) { if (manual) toast(L("Collez d'abord le lien de la feuille", 'لصق الرابط ديال الورقة أولا')); return; }
  if (shBusy) { shAgain = true; return; }
  shBusy = true;
  let body;
  try { body = JSON.stringify({key: s.key, at: new Date().toISOString(), rtl: LANG === 'ar', title: (db.settings.shopName || 'MaBoutique') + ' — ' + L('Sauvegarde', 'النسخة الاحتياطية'), sheets: sheetTables()}); }
  catch (e) { shBusy = false; setShSt('err', e.message); return; }
  setShSt('sending');
  try {
    const r = await fetch(s.url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body});
    const j = await r.json();
    if (j.ok) {
      if (j.url && s.sheetUrl !== j.url) { s.sheetUrl = j.url; shBusy = false; save(); if (current === 'settings') render(); }
      setShSt('ok'); if (manual) toast(L('✅ Tout est enregistré dans Google Sheets', '✅ تسجل كلشي فـ Google Sheets'));
    } else {
      setShSt('err', j.err === 'key' ? L('Clé incorrecte : recopiez le code dans Apps Script puis refaites « Déployer »', 'المفتاح ماشي هو: عاود نسخ الكود فـ Apps Script ودير Deploy جديد') : L('Erreur de la feuille : ', 'الورقة رجعات غلط: ') + (j.err || ''));
    }
  } catch (e) {
    try { await fetch(s.url, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body}); setShSt('sent'); }
    catch (e2) { setShSt('err', navigator.onLine === false ? L('Pas de connexion · envoi au retour d\'internet', 'ما كاينش الأنترنيت · غادي تتصيفط ملي يرجع') : L('La feuille ne répond pas : vérifiez le lien', 'الورقة ما جاوباتش: شوف الرابط')); }
  } finally { shBusy = false; if (shAgain) { shAgain = false; queueSheet(); } }
}
window.addEventListener('online', () => { if (shSt.state === 'err') queueSheet(); });
function sheetCode() { return $('#gsCode').textContent.replace('__KEY__', SH().key).trim(); }
async function copySheetCode() {
  const code = sheetCode(); save();
  const box = $('#shCodeBox');
  try { await navigator.clipboard.writeText(code); toast(L('📋 Code copié · collez-le dans Apps Script', '📋 تنسخ الكود · لصقو فـ Apps Script')); }
  catch (e) { if (box) { box.hidden = false; box.value = code; box.focus(); box.select(); } toast(L('Copiez le code depuis la case', 'نسخ الكود من الخانة')); }
}
function connectSheet() {
  const url = val('shUrl');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(url)) return uiAlert(L('Collez le lien « Application Web » qui finit par /exec (Apps Script → Déployer).', 'لصق الرابط ديال « Application Web » اللي كيسالي بـ /exec (Apps Script ← Déployer).'));
  SH().url = url; save(); render(); sendSheet(true);
}
async function disconnectSheet() {
  if (!await uiConfirm(L('Délier Google Sheets ? La feuille reste dans votre Google Drive.', 'نفكو الربط مع Google Sheets؟ الورقة كتبقى فـ Google Drive ديالك.'), L('Délier', 'فك الربط'), true)) return;
  const s = SH(); delete s.url; delete s.sheetUrl; save(); render();
}
function sheetCard() {

    <div id="shStatus" style="margin-bottom:12px">${shStatusHtml()}</div>
    <div class="toolbar">${s.sheetUrl ? `<a class="btn green" href="${esc(s.sheetUrl)}" target="_blank" rel="noopener">${L('Ouvrir la feuille', 'حل الورقة')}</a>` : ''}
    <button class="btn sec" onclick="sendSheet(true)">${L('Envoyer maintenant', 'صيفط دابا')}</button>

    <p class="note">${L('Gardez une copie bien organisée de tout (stock, ventes, crédit…) dans Google Sheets, mise à jour toute seule.', 'خلي نسخة منظمة ديال كلشي (المخزون، المبيعات، الكريدي…) فـ Google Sheets، كتحدث بوحدها.')}</p>
    <ol class="note" style="padding-inline-start:20px;line-height:1.7">
      <li>${L('Ouvrez', 'حل')} <a href="https://sheets.new" target="_blank" rel="noopener">sheets.new</a> ${L('(nouvelle feuille Google).', '(ورقة Google جديدة).')}</li>
      <li>${L('Menu « Extensions » → « Apps Script ».', 'القائمة « Extensions » ← « Apps Script ».')}</li>
      <li>${L('Effacez tout, puis collez le code :', 'مسح كلشي، ولصق الكود:')} <button class="btn sm" onclick="copySheetCode()">${L('Copier le code', 'نسخ الكود')}</button></li>
      <li>${L('« Déployer » → « Nouveau déploiement » → type « Application Web », accès : « Tout le monde » → « Déployer » → autorisez.', '« Déployer » ← « Nouveau déploiement » ← النوع « Application Web »، الوصول: « Tout le monde » ← « Déployer » ← وافق.')}</li>
      <li>${L('Copiez le lien qui finit par /exec et collez-le ici :', 'نسخ الرابط اللي كيسالي بـ /exec ولصقو هنا:')}</li>
    </ol>
    <textarea id="shCodeBox" rows="4" hidden readonly style="font:12px monospace;margin-bottom:8px"></textarea>
    <div class="row"><input id="shUrl" placeholder="https://script.google.com/macros/s/…/exec" style="direction:ltr"><button class="btn" onclick="connectSheet()">${L('Relier', 'ربط')}</button></div></div>`;
}

/* ================== CONNEXION / CRÉATION DE COMPTE ================== */
let authMode = 'login', googleEnabled = false;
// Le bouton Google n'apparaît que si Google est activé dans Supabase.
async function checkProviders() {
  try {
    const s = await (await fetch(SB_URL + '/auth/v1/settings', {headers: {apikey: SB_KEY}})).json();
    googleEnabled = !!(s.external && s.external.google);
    if (!$('#auth').hidden) showAuth();
  } catch (e) {}
}
function showAuth(mode) {
  authMode = mode || authMode; const a = $('#auth'), isS = authMode === 'signup';
  a.hidden = false;
  a.innerHTML = `<div class="ahero"><div class="ahero-in">
    <div class="atop"><span class="abrand">Ma<b>Boutique</b></span><button type="button" class="alang" onclick="setLang(LANG === 'ar' ? 'fr' : 'ar')">${LANG === 'ar' ? 'Français' : 'العربية'}</button></div>
    <h1>${isS ? L('Créer un compte', 'إنشاء حساب') : L('Bon retour 👋', 'مرحبا بيك 👋')}</h1>
    <p>${isS ? L('Créez votre compte : vos données restent en ligne et vous les retrouvez sur tous vos appareils.', 'دير حساب: البيانات ديالك كتبقى محفوظة أونلاين وكتلقاها فكاع الأجهزة ديالك.') : L('Entrez votre e-mail et votre mot de passe.', 'دخل الإيميل والمودباس ديالك.')}</p>
  </div></div>
  <div class="authbox">
    ${googleEnabled ? `<button type="button" class="gbtn" onclick="googleLogin()"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>${L('Continuer avec Google', 'كمل بـ Google')}</button>
    <div class="or"><span>${L('ou avec votre e-mail', 'ولا بالإيميل')}</span></div>` : ''}
    <div class="seg"><button type="button" class="${isS ? '' : 'on'}" onclick="showAuth('login')">${L('Connexion', 'الدخول')}</button><button type="button" class="${isS ? 'on' : ''}" onclick="showAuth('signup')">${L('Créer un compte', 'حساب جديد')}</button></div>
    <form id="authForm" onsubmit="event.preventDefault(); authSubmit();">
      ${isS ? `<label class="l" for="a_shop">${L('Nom du magasin', 'سمية المحل')}</label><input id="a_shop" autocomplete="organization">` : ''}
      <label class="l" for="a_email">${L('E-mail', 'الإيميل')}</label><input id="a_email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" required>
      <label class="l" for="a_pass">${L('Mot de passe', 'المودباس')}</label><input id="a_pass" type="password" autocomplete="${isS ? 'new-password' : 'current-password'}" minlength="6" required>
      ${isS ? `<label class="l" for="a_pass2">${L('Confirmer le mot de passe', 'عاود المودباس')}</label><input id="a_pass2" type="password" autocomplete="new-password" minlength="6" required>` : ''}
      <p id="authMsg" class="amsg" hidden></p>
      <button class="btn block" id="authBtn" type="submit">${isS ? L('Créer mon compte', 'دير الحساب') : L('Se connecter', 'دخل')}</button>
    </form>
    ${isS ? '' : `<button type="button" class="linkbtn" onclick="forgotPass()">${L('Mot de passe oublié ?', 'نسيتي المودباس؟')}</button>`}
  </div>
  <p class="afoot">MaBoutique · ${L('Vente & Achat', 'البيع والشراء')}</p>`;
}
function hideAuth() { $('#auth').hidden = true; $('#auth').innerHTML = ''; }
function authMsg(t, ok) { const m = $('#authMsg'); if (!m) return; m.hidden = false; m.textContent = t; m.className = 'amsg' + (ok ? ' ok' : ''); }
function authErr(e) {
  const s = String((e && e.message) || '').toLowerCase();
  if (s.includes('invalid login')) return L('E-mail ou mot de passe incorrect.', 'الإيميل ولا المودباس غالط.');
  if (s.includes('already')) return L('Ce compte existe déjà. Connectez-vous.', 'هاد الحساب كاين ديجا. دخل.');
  if (s.includes('not confirmed')) return L("Confirmez d'abord votre e-mail (regardez votre boîte de réception).", 'أكد الإيميل ديالك قبل (شوف البريد ديالك).');
  if (s.includes('rate limit') || s.includes('security purposes')) return L('Trop de tentatives. Réessayez dans quelques minutes.', 'بزاف ديال المحاولات. عاود من بعد شوية.');
  if (s.includes('password')) return L('Mot de passe trop court (6 caractères minimum).', 'المودباس قصير بزاف (6 حروف على الأقل).');
  if (s.includes('fetch') || s.includes('network')) return L('Pas de connexion internet.', 'ما كاينش الأنترنيت.');
  if (s.includes('email')) return L('Adresse e-mail invalide.', 'الإيميل ماشي صحيح.');
  return (e && e.message) || 'Erreur';
}
async function authSubmit() {
  const email = val('a_email').toLowerCase(), pass = $('#a_pass').value, btn = $('#authBtn');
  if (!email || !pass) return;
  btn.disabled = true;
  try {
    if (authMode === 'signup') {
      if (pass !== $('#a_pass2').value) return authMsg(L('Les deux mots de passe ne sont pas identiques.', 'جوج المودباسات ماشي بحال بحال.'));
      const shop = val('a_shop');
      const {data, error} = await sb.auth.signUp({email, password: pass, options: {emailRedirectTo: location.origin + location.pathname, data: {shop_name: shop}}});
      if (error) throw error;
      if (data.session) await startUser(data.user, shop);
      else authMsg(L('Compte créé ✅ Ouvrez le lien envoyé à votre e-mail pour le confirmer, puis connectez-vous.', 'تدار الحساب ✅ حل الرابط اللي تصيفط للإيميل ديالك باش تأكدو، ومن بعد دخل.'), true);
    } else {
      const {data, error} = await sb.auth.signInWithPassword({email, password: pass});
      if (error) throw error;
      await startUser(data.user);
    }
  } catch (e) { authMsg(authErr(e)); }
  finally { if ($('#authBtn')) $('#authBtn').disabled = false; }
}
async function googleLogin() {
  const {error} = await sb.auth.signInWithOAuth({provider: 'google', options: {redirectTo: location.origin + location.pathname}});
  if (error) authMsg(error.message && error.message.toLowerCase().includes('provider is not enabled') ? L("La connexion Google n'est pas encore activée.", 'الدخول بـ Google ما زال ما تفعلش.') : authErr(error));
}
async function forgotPass() {
  const email = val('a_email').toLowerCase();
  if (!email) return authMsg(L("Écrivez d'abord votre e-mail.", 'كتب الإيميل ديالك قبل.'));
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
  authMsg(error ? authErr(error) : L('Un e-mail pour changer le mot de passe vous a été envoyé.', 'تصيفط ليك إيميل باش تبدل المودباس.'), !error);
}
/* ---------- Fenêtre « Mon compte » (clic sur le nom du magasin) ---------- */
function showAccount() {
  const st = db.settings, md = (user && user.user_metadata) || {};
  const provider = user && user.app_metadata ? (user.app_metadata.provider || 'email') : null;
  const name = md.full_name || md.name || st.shopName || '';
  const avatar = md.avatar_url || md.picture;
  const initial = esc((String(name || (user && user.email) || '?').trim()[0] || '?').toUpperCase());
  const since = user && user.created_at ? fdate(user.created_at.slice(0, 10)) : '';
  const row = (k, v) => v ? `<div class="acc-row"><span>${k}</span><span>${v}</span></div>` : '';
  const head = user ? `
    <div class="acc-head">
      ${avatar ? `<img class="acc-av" src="${esc(avatar)}" alt="" referrerpolicy="no-referrer">` : `<div class="acc-av">${initial}</div>`}
      <div class="acc-name">${esc(name)}</div>
      <div class="acc-mail">${esc(user.email || '')}</div>
      <span class="acc-badge">${provider === 'google' ? L('Connecté avec Google', 'داخل بـ Google') : L('Connecté avec e-mail', 'داخل بالإيميل')}</span>
    </div>` : `<div class="acc-head"><div class="acc-av">${initial}</div><div class="acc-name">${esc(st.shopName || '')}</div><span class="acc-badge">${L('Sans compte (données dans ce téléphone)', 'بلا حساب (البيانات فهاد التيليفون)')}</span></div>`;
  openModal(L('Mon compte', 'الحساب ديالي'), `${head}
    <div class="acc-stats">
      <div><b>${db.products.length}</b><span>${L('Produits', 'منتوجات')}</span></div>
      <div><b>${db.clients.length}</b><span>${L('Clients', 'زبناء')}</span></div>
      <div><b>${db.sales.length}</b><span>${L('Ventes', 'مبيعات')}</span></div>
    </div>
    <h2>${L('Magasin', 'المحل')}</h2>
    <div class="acc-list">
      ${row(L('Nom', 'السمية'), esc(st.shopName))}
      ${row(L('Téléphone', 'التيليفون'), esc(st.phone))}
      ${row(L('Adresse', 'العنوان'), esc(st.address))}
      ${row('ICE / RC', esc(st.ice))}
      ${!st.phone && !st.address ? `<div class="acc-row"><span>${L('Complétez les informations du magasin dans les paramètres.', 'كمل المعلومات ديال المحل فالإعدادات.')}</span><span></span></div>` : ''}
    </div>
    ${user ? `<h2>${L('Compte', 'الحساب')}</h2><div class="acc-list">
      ${row(L('E-mail', 'الإيميل'), `<span style="direction:ltr;display:inline-block">${esc(user.email || '')}</span>`)}
      ${row(L('Connexion', 'الدخول'), provider === 'google' ? 'Google' : L('E-mail + mot de passe', 'إيميل + مودباس'))}
      ${row(L('Membre depuis', 'عضو من'), since)}
    </div>` : ''}
    <div class="acc-actions">
      <button class="btn" onclick="go('settings')">${L('Modifier les informations', 'بدل المعلومات')}</button>
      ${user ? `<button class="btn sec" onclick="changePassword(${provider === 'google'})">${provider === 'google' ? L('Créer un mot de passe', 'دير مودباس') : L('Changer le mot de passe', 'بدل المودباس')}</button>` : ''}
      ${user && provider === 'google' ? `<p class="note" style="margin:0;text-align:center">${L("Avec un mot de passe, vous pourrez aussi vous connecter avec votre e-mail (sans Google).", 'بالمودباس تقدر تدخل حتى بالإيميل ديالك (بلا Google).')}</p>` : ''}
      ${user ? `<button class="btn sec" style="color:var(--bad)" onclick="logout()">${L('Se déconnecter', 'خروج')}</button>` : ''}
    </div>`);
}
async function changePassword(isNew) {
  const p = await uiPrompt(isNew ? L('Choisissez un mot de passe (6 caractères minimum)', 'اختار مودباس (6 حروف على الأقل)') : L('Nouveau mot de passe (6 caractères minimum)', 'مودباس جديد (6 حروف على الأقل)'), '', true);
  if (!p) return;
  if (p.length < 6) return uiAlert(L('Mot de passe trop court (6 caractères minimum).', 'المودباس قصير بزاف (6 حروف على الأقل).'));
  const p2 = await uiPrompt(L('Retapez le mot de passe', 'عاود كتب المودباس'), '', true);
  if (p2 === null) return;
  if (p2 !== p) return uiAlert(L('Les deux mots de passe ne sont pas identiques.', 'جوج المودباسات ماشي بحال بحال.'));
  const {error} = await sb.auth.updateUser({password: p});
  if (error) return uiAlert(authErr(error));
  uiAlert(isNew ? L(`Mot de passe créé ✅\nVous pouvez maintenant vous connecter avec ${user.email} et ce mot de passe, ou toujours avec Google.`, `تدار المودباس ✅\nدابا تقدر تدخل بـ ${user.email} وهاد المودباس، ولا ديما بـ Google.`) : L('Mot de passe changé ✅', 'تبدل المودباس ✅'));
}
async function logout() {
  if (!await uiConfirm(L('Se déconnecter de ce compte ?', 'تخرج من هاد الحساب؟'), L('Se déconnecter', 'خروج'))) return;
  if (pushTimer) { clearTimeout(pushTimer); await push(); }
  await sb.auth.signOut(); user = null; db = emptyDB(); render(); showAuth('login');
}
async function initAuth() {
  if (!sb) { loadCache(); render(); return; } // projet en ligne pas encore configuré : mode téléphone seul
  checkProviders();
  sb.auth.onAuthStateChange(async (ev) => {
    if (ev === 'PASSWORD_RECOVERY') {
      const p = await uiPrompt(L('Nouveau mot de passe (6 caractères minimum)', 'مودباس جديد (6 حروف على الأقل)'), '', true);
      if (p) { const {error} = await sb.auth.updateUser({password: p}); uiAlert(error ? authErr(error) : L('Mot de passe changé ✅', 'تبدل المودباس ✅')); }
    }
  });
  // Erreur renvoyée par Google/Supabase dans l'adresse (ex. connexion Google refusée)
  const qs = new URLSearchParams(location.search + '&' + location.hash.replace(/^#/, ''));
  const oauthErr = qs.get('error_description') || qs.get('error');
  if (oauthErr) history.replaceState(null, '', location.pathname);
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch (e) {}
  if (session) await startUser(session.user);
  else { showAuth('login'); if (oauthErr) authMsg(L('La connexion Google a échoué. Réessayez ou utilisez votre e-mail.', 'الدخول بـ Google ما خدمش. عاود ولا دخل بالإيميل.') + ' (' + oauthErr + ')'); }
}

/* ================== DÉMARRAGE ================== */
if (/\.netlify\.app$/.test(location.hostname)) document.documentElement.classList.add('has-badge');
db = emptyDB();
render();
initAuth();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.update().catch(() => {});
    // L'app de l'écran d'accueil (iPhone) reste souvent ouverte en arrière-plan : on vérifie à chaque retour et toutes les 30 min.
    const check = () => reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
    window.addEventListener('focus', check); window.addEventListener('pageshow', check);
    setInterval(check, 30 * 60 * 1000);
  }).catch(() => {});
  // Quand une nouvelle version est installée, recharger une fois pour l'afficher.
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
